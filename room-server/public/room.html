<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Call Copilot Room</title>
    <style>
      :root {
        --bg: #f5f6f8;
        --panel: #ffffff;
        --border: #dfe2e7;
        --text: #16181c;
        --muted: #6b7280;
        --accent: #4f8cff;
        --mine: #e7efff;
        --host: #fff4e0;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #14161a;
          --panel: #1d2026;
          --border: #2c3038;
          --text: #e6e8ec;
          --muted: #8b919c;
          --mine: #22304a;
          --host: #3a2f1c;
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font: 16px/1.45 system-ui, -apple-system, 'Segoe UI', sans-serif;
        display: flex;
        flex-direction: column;
      }
      header {
        padding: 12px 16px;
        border-bottom: 1px solid var(--border);
        background: var(--panel);
        display: flex;
        align-items: center;
        gap: 8px;
      }
      header h1 {
        font-size: 16px;
        margin: 0;
      }
      #status {
        margin-left: auto;
        font-size: 13px;
        color: var(--muted);
      }
      #messages {
        flex: 1;
        overflow-y: auto;
        padding: 12px 16px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .msg {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 8px 12px;
        max-width: 85%;
        overflow-wrap: anywhere;
      }
      .msg.mine {
        align-self: flex-end;
        background: var(--mine);
      }
      .msg.host {
        background: var(--host);
      }
      .msg .who {
        font-size: 12px;
        color: var(--muted);
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .msg .copy {
        margin-left: auto;
        background: none;
        border: none;
        padding: 2px 4px;
        color: var(--accent);
        font-size: 12px;
        font-weight: 500;
      }
      .msg .shot {
        display: block;
        max-width: 100%;
        border-radius: 8px;
        border: 1px solid var(--border);
        margin: 4px 0 6px;
      }
      .md > :first-child {
        margin-top: 0;
      }
      .md > :last-child {
        margin-bottom: 0;
      }
      .md p,
      .md ul,
      .md ol,
      .md pre,
      .md blockquote {
        margin: 0 0 6px;
      }
      .md ul,
      .md ol {
        padding-left: 20px;
      }
      .md code {
        font: 13px ui-monospace, Menlo, Consolas, monospace;
        background: rgba(127, 127, 127, 0.15);
        border-radius: 4px;
        padding: 1px 4px;
      }
      .md pre {
        background: rgba(127, 127, 127, 0.12);
        border-radius: 8px;
        padding: 8px 10px;
        overflow-x: auto;
      }
      .md pre code {
        background: none;
        padding: 0;
      }
      .md a {
        color: var(--accent);
      }
      .md blockquote {
        border-left: 3px solid var(--border);
        padding-left: 10px;
        color: var(--muted);
      }
      form {
        display: flex;
        gap: 8px;
        padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
        border-top: 1px solid var(--border);
        background: var(--panel);
      }
      input,
      textarea,
      button {
        font: inherit;
        color: inherit;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: var(--bg);
        padding: 10px 12px;
      }
      textarea {
        flex: 1;
        resize: none;
        min-width: 0;
      }
      button {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
        font-weight: 600;
      }
      button:disabled {
        opacity: 0.5;
      }
      #join {
        margin: auto;
        width: min(360px, calc(100% - 32px));
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .hidden {
        display: none !important;
      }
      .notice {
        text-align: center;
        color: var(--muted);
        padding: 24px 16px;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Call Copilot Room</h1>
      <span id="status">Not connected</span>
    </header>

    <div id="join">
      <p>Enter your name to join the room.</p>
      <input id="name" maxlength="40" placeholder="Your name" autocomplete="name" />
      <button id="joinBtn">Join</button>
    </div>

    <div id="messages" class="hidden"></div>
    <form id="composer" class="hidden">
      <textarea id="text" rows="2" maxlength="1000" placeholder="Type a message… (Markdown works)"></textarea>
      <button id="sendBtn" type="submit">Send</button>
    </form>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/vendor/marked.js"></script>
    <script src="/vendor/purify.js"></script>
    <script>
      const roomId = location.pathname.split('/').pop()
      const $ = (id) => document.getElementById(id)

      // Links open in a new tab; everything else is sanitized by DOMPurify.
      DOMPurify.addHook('afterSanitizeAttributes', (node) => {
        if (node.tagName === 'A') {
          node.setAttribute('target', '_blank')
          node.setAttribute('rel', 'noopener noreferrer')
        }
      })
      function renderMarkdown(text) {
        return DOMPurify.sanitize(marked.parse(text, { breaks: true, gfm: true }), { FORBID_TAGS: ['img', 'style'] })
      }
      let me = ''
      let socket

      function storage(fn) {
        try {
          return fn(localStorage)
        } catch {
          return null
        }
      }

      function showNotice(text) {
        $('messages').classList.remove('hidden')
        const div = document.createElement('div')
        div.className = 'notice'
        div.textContent = text
        $('messages').appendChild(div)
      }

      // navigator.clipboard only exists on https; rooms on a LAN address are plain http, so fall back.
      async function copyText(text) {
        try {
          await navigator.clipboard.writeText(text)
          return true
        } catch {
          const area = document.createElement('textarea')
          area.value = text
          area.setAttribute('readonly', '')
          area.style.position = 'fixed'
          area.style.opacity = '0'
          document.body.appendChild(area)
          area.select()
          const ok = document.execCommand('copy')
          area.remove()
          return ok
        }
      }

      function addMessage(m) {
        const div = document.createElement('div')
        div.className = 'msg' + (m.host ? ' host' : '') + (!m.host && m.name === me ? ' mine' : '')
        const who = document.createElement('div')
        who.className = 'who'
        const label = document.createElement('span')
        label.textContent = `${m.name} · ${new Date(m.at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}`
        who.append(label)
        if (m.text) {
          const copy = document.createElement('button')
          copy.type = 'button'
          copy.className = 'copy'
          copy.textContent = 'Copy'
          copy.onclick = async () => {
            copy.textContent = (await copyText(m.text)) ? 'Copied' : 'Copy failed'
            setTimeout(() => (copy.textContent = 'Copy'), 1200)
          }
          who.append(copy)
        }
        div.append(who)
        // Pictures come from the host only and the server accepts nothing but image data: URLs.
        if (typeof m.image === 'string' && m.image.startsWith('data:image/')) {
          const img = document.createElement('img')
          img.className = 'shot'
          img.alt = 'Picture shared by the host'
          img.src = m.image
          div.append(img)
        }
        if (m.text) {
          const body = document.createElement('div')
          body.className = 'md'
          body.innerHTML = renderMarkdown(m.text)
          div.append(body)
        }
        $('messages').appendChild(div)
        $('messages').scrollTop = $('messages').scrollHeight
      }

      function join() {
        me = $('name').value.trim() || 'Guest'
        storage((s) => s.setItem('cc-name', me))
        $('join').classList.add('hidden')
        $('messages').classList.remove('hidden')
        $('composer').classList.remove('hidden')

        socket = io({ auth: { role: 'guest', roomId, name: me } })
        socket.on('connect', () => ($('status').textContent = 'Connected'))
        socket.on('disconnect', () => ($('status').textContent = 'Reconnecting…'))
        socket.on('room:history', (messages) => {
          $('messages').replaceChildren()
          messages.forEach(addMessage)
        })
        socket.on('message:new', addMessage)
        socket.on('room:presence', ({ guests, hostOnline }) => {
          $('status').textContent = `${guests.length} here · host ${hostOnline ? 'online' : 'away'}`
        })
        socket.on('fatal', ({ error }) => {
          socket.io.opts.reconnection = false
          $('composer').classList.add('hidden')
          showNotice(error)
        })
        socket.on('room:closed', ({ reason }) => {
          socket.io.opts.reconnection = false
          $('composer').classList.add('hidden')
          $('status').textContent = 'Closed'
          showNotice(reason)
        })
      }

      $('name').value = storage((s) => s.getItem('cc-name')) || ''
      $('joinBtn').onclick = join
      $('name').onkeydown = (e) => e.key === 'Enter' && join()

      $('composer').onsubmit = (e) => {
        e.preventDefault()
        const text = $('text').value.trim()
        if (!text || !socket?.connected) return
        $('sendBtn').disabled = true
        socket.emit('message:send', { text }, (res) => {
          $('sendBtn').disabled = false
          if (res?.ok) $('text').value = ''
          else if (res?.error) $('status').textContent = res.error
        })
      }
      $('text').onkeydown = (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault()
          $('composer').requestSubmit()
        }
      }
    </script>
  </body>
</html>
