<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:" />
    <title>Call Copilot</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
        user-select: none;
      }
      #bubble {
        position: absolute;
        inset: 4px;
        border-radius: 50%;
        background: #4f8cff;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
        display: grid;
        place-items: center;
        cursor: pointer;
        transition: transform 0.12s ease;
      }
      #bubble:hover {
        transform: scale(1.06);
      }
      #bubble.dragging {
        cursor: grabbing;
        transform: scale(0.96);
      }
      svg {
        width: 26px;
        height: 26px;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="bubble" title="Open Call Copilot (drag to move)">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path fill="#fff" d="M12 3C6.5 3 2 6.6 2 11c0 2.4 1.3 4.5 3.4 6L4.5 21l4.4-2.3c1 .3 2 .4 3.1.4 5.5 0 10-3.6 10-8S17.5 3 12 3z" />
        <circle cx="8" cy="11" r="1.4" fill="#4f8cff" />
        <circle cx="12" cy="11" r="1.4" fill="#4f8cff" />
        <circle cx="16" cy="11" r="1.4" fill="#4f8cff" />
      </svg>
    </div>
    <script type="module" src="./src/bubble.ts"></script>
  </body>
</html>
